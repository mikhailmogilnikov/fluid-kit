name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Commit messages and changesets are checked against the base branch
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          # No git hooks on CI
          VP_GIT_HOOKS: "0"

      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
      - name: Changesets
        # A change to a package's src or package.json needs a changeset (`pnpm changeset`, or `--empty`)
        if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main' && github.actor != 'dependabot[bot]'
        run: pnpm exec changeset status --since=origin/${{ github.base_ref }}

      - run: pnpm exec vp fmt --check
      - run: pnpm exec vp lint
      # Builds every package first
      - run: pnpm check-types
      - run: pnpm test

  # Every case of the playground, its steps run and what each should do checked, in three engines
  playground:
    runs-on: ubuntu-latest
    # Playwright's own image: the browsers and the libraries they need are in it. Installing those on
    # the runner took Ubuntu's mirror 12 minutes once and more than 25 another time. Its version
    # follows the docs app's `playwright`; a mismatch only downloads the browsers below
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      # Firefox doesn't run as root
      options: --user 1001
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          VP_GIT_HOOKS: "0"
      # The packages, then the site on them
      - run: pnpm build
      # Already in the image when the versions match; downloaded (not installed) when they don't
      - run: pnpm --filter docs exec playwright install chromium webkit firefox
      - run: pnpm --filter docs check:playground
