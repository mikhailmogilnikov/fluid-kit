name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Trusted Publishing: npm takes the workflow's OIDC token instead of a long-lived one, and signs
  # provenance with it
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        # No registry-url: it writes an .npmrc that asks for a token, which would stand in the way
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          VP_GIT_HOOKS: "0"

      # Pending changesets: opens or updates the "Version packages" pull request.
      # None pending: publishes whatever version isn't on npm yet, then tags it and makes its GitHub
      # release. v2 is the action for Changesets v3: it learns what was published from the file
      # `CHANGESETS_OUTPUT` names, which `pnpm release` passes down to `changeset publish`; v1 read
      # v2's output and found nothing in v3's
      - uses: changesets/action@v2
        with:
          version-script: pnpm version-packages
          publish-script: pnpm release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        # Publishing needs no npm token: each package trusts this workflow on npm (Trusted Publishing)
        env:
          NPM_CONFIG_PROVENANCE: "true"
