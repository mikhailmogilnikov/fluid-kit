name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  # Trusted Publishing: npm takes the workflow's OIDC token instead of a long-lived one, and signs
  # provenance with it
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        # No registry-url: it writes an .npmrc that asks for a token, which would stand in the way
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          VP_GIT_HOOKS: "0"

      # Pending changesets: opens or updates the "Version packages" pull request.
      # None pending: publishes whatever version isn't on npm yet, and tags it.
      - uses: changesets/action@v2
        with:
          version: pnpm version-packages
          publish: pnpm release
          commit: "chore(release): version packages"
          title: "chore(release): version packages"
        # Publishing needs no npm token: each package trusts this workflow on npm (Trusted Publishing)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
