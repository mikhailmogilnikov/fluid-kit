version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ["*"]
    ignore:
      # The docs stay on TypeScript 6 for `astro check`, which doesn't run on 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore"
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
